[package]
name = "atlas-chat"
version = "0.1.0"
description = "Atlas Life desktop chat (DeepSeek + GitHub private memory)"
authors = ["Atlas Memory"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "atlas_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
